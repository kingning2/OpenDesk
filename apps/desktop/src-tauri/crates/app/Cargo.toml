crawler = { path = "../../../../../business/crawler" }
chat = { path = "../../../../../business/chat" }
customer = { path = "../../../../../business/customer" }
app-core = { path = "../../../../../business/app-core" }
knowledge = { path = "../../../../../business/knowledge" }
kernel = { path = "../../../../../crates/kernel" }
mail = { path = "../../../../../business/mail" }
ports = { path = "../../../../../crates/ports" }
storage = { path = "../../../../../crates/storage" }
agent = { path = "../../../../../crates/agent" }
opendesk-skills = { path = "../../../../../business/opendesk-skills" }
base64 = { workspace = true }
rmcp = { version = "0", features = ["client", "server", "transport-io", "schemars"] }
tracing = { workspace = true }
