[package]
name = "dingda"
version.workspace = true
edition.workspace = true
default-run = "dingda"

[lib]
name = "dingda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dingda"
path = "src/main.rs"

[[bin]]
name = "dingda-dev-channel"
path = "src/bin/dingda_dev_channel.rs"

[features]
default = []
license-lock = []

[build-dependencies]
serde_json = { workspace = true }
tauri-build = { workspace = true }

[dependencies]
adapter = { path = "../../../crates/adapter" }
app = { package = "dingda-business", path = "../../../business" }
agent = { path = "../../../crates/agent" }
async-trait = { workspace = true }
common = { path = "../../../crates/common" }
base64 = "0.22"
chrono = { workspace = true }
diesel = { workspace = true }
futures-util = { workspace = true }
kernel = { path = "../../../crates/kernel" }
md-5 = { workspace = true }
dingda-macros = { path = "../../../crates/dingda-macros" }
platform = { path = "../../../crates/platform" }
ports = { path = "../../../crates/ports" }
rand = { workspace = true }
reqwest = { workspace = true }
rmpv = { workspace = true }
runtime = { path = "../../../crates/runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
storage = { path = "../../../crates/storage" }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zip = "2"
dirs = { workspace = true }
