[package]
name = "opendesk-server"
version.workspace = true
edition.workspace = true

[features]
default = []
license-lock = ["app-core/license-lock"]

[dependencies]
app-core = { path = "../../../business/app-core" }
common = { path = "../../../crates/common" }
ports = { path = "../../../crates/ports" }
storage = { path = "../../../crates/storage" }
crawler = { path = "../../../business/crawler" }
agent = { path = "../../../crates/agent" }
chat = { path = "../../../business/chat" }
knowledge = { path = "../../../business/knowledge" }
mail = { path = "../../../business/mail" }
customer = { path = "../../../business/customer" }
workflow_runtime = { path = "../../../business/workflow_runtime" }
kernel = { path = "../../../crates/kernel" }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "io-util", "time"] }
tokio-stream = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
