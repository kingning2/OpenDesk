[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "shared",
  "openai>=1.40",
  "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.uv.sources]
shared = { workspace = true }