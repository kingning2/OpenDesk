<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="粘土微缩场景：大门敞开，走向开源社区">
  <defs>
    <radialGradient id="glow" cx="0.74" cy="0.24" r="0.72" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFF4DD" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#F3E3C0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F5EDE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doorlight" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#FFF3D2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF3D2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C7EAA"/>
      <stop offset="1" stop-color="#7C5E8A"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#F5EDE0"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- 背景 -->
  <path d="M0 500 Q 520 380 1100 470 T 1920 430 V 1080 H 0 Z" fill="#ECDFC4"/>
  <path d="M0 640 Q 680 540 1380 610 T 1920 590 V 1080 H 0 Z" fill="#E4D3B2"/>

  <!-- 节点网络（开源社区） -->
  <g stroke="#C9A24B" stroke-width="5" opacity="0.8">
    <path d="M 260 300 L 420 220 L 600 300"/>
    <path d="M 420 220 L 500 120"/>
    <path d="M 260 300 L 180 160"/>
    <path d="M 600 300 L 700 180"/>
  </g>
  <circle cx="260" cy="300" r="14" fill="#8E6E9C"/>
  <circle cx="420" cy="220" r="11" fill="#8E6E9C"/>
  <circle cx="600" cy="300" r="14" fill="#8E6E9C"/>
  <circle cx="500" cy="120" r="9" fill="#8E6E9C"/>
  <circle cx="180" cy="160" r="8" fill="#8E6E9C"/>
  <circle cx="700" cy="180" r="8" fill="#8E6E9C"/>

  <!-- 拱门 -->
  <ellipse cx="1420" cy="520" rx="420" ry="420" fill="url(#doorlight)" opacity="0.9"/>
  <path d="M 1210 1080 L 1210 720 Q 1210 460 1420 460 Q 1630 460 1630 720 L 1630 1080 Z" fill="url(#arch)"/>
  <path d="M 1262 1080 L 1262 736 Q 1262 510 1420 510 Q 1578 510 1578 736 L 1578 1080 Z" fill="#8E6E9C"/>
  <!-- 微开的门与透出的光 -->
  <rect x="1460" y="520" width="150" height="560" rx="10" fill="#C9B184"/>
  <path d="M 1384 1080 L 1384 760 Q 1384 560 1500 530 L 1500 1080 Z" fill="#FFF1CB"/>
  <ellipse cx="1380" cy="820" rx="120" ry="200" fill="#FFF3D2" opacity="0.5"/>

  <!-- 走向开源的人 -->
  <g>
    <ellipse cx="960" cy="820" rx="9" ry="3" fill="#C9AE7E"/>
    <circle cx="960" cy="790" r="13" fill="#BFA87E"/>
    <path d="M 944 830 Q 950 806 962 806 L 978 830 Q 966 866 948 866 Z" fill="#CBB487"/>
  </g>
  <g>
    <ellipse cx="1070" cy="840" rx="9" ry="3" fill="#C9AE7E"/>
    <circle cx="1070" cy="810" r="13" fill="#D3BC8D"/>
    <path d="M 1054 850 Q 1060 826 1072 826 L 1088 850 Q 1076 886 1058 886 Z" fill="#D9C499"/>
  </g>
  <g>
    <ellipse cx="1180" cy="862" rx="9" ry="3" fill="#C9AE7E"/>
    <circle cx="1180" cy="832" r="13" fill="#C2A878"/>
    <path d="M 1164 872 Q 1170 848 1182 848 L 1198 872 Q 1186 908 1168 908 Z" fill="#D3BC8D"/>
  </g>

  <!-- 前景地面 -->
  <ellipse cx="980" cy="1060" rx="840" ry="110" fill="#E0CEA6" opacity="0.55"/>
  <path d="M 1040 1080 Q 1220 940 1420 940 Q 1680 940 1920 1020 V 1080 Z" fill="#D9C499" opacity="0.6"/>

  <!-- 尘埃光斑 -->
  <circle cx="330" cy="620" r="7" fill="#E8D6AC" opacity="0.6"/>
  <circle cx="560" cy="500" r="6" fill="#E8D6AC" opacity="0.5"/>
  <circle cx="240" cy="820" r="8" fill="#E8D6AC" opacity="0.45"/>
  <circle cx="1720" cy="700" r="6" fill="#E8D6AC" opacity="0.5"/>
</svg>
