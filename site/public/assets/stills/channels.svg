<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="粘土微缩场景：多电商渠道汇聚一个入口">
  <defs>
    <radialGradient id="glow" cx="0.7" cy="0.2" r="0.7" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFF4DD" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#F6E5C0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F5EDE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE1BC"/>
      <stop offset="1" stop-color="#E2CF9F"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#F5EDE0"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- 背景 -->
  <path d="M0 500 Q 520 380 1080 470 T 1920 430 V 1080 H 0 Z" fill="#ECDFC4"/>
  <path d="M0 640 Q 680 540 1360 610 T 1920 590 V 1080 H 0 Z" fill="#E4D3B2"/>

  <!-- 连线（枢纽 → 各渠道） -->
  <path d="M 1120 600 Q 1330 470 1500 430" fill="none" stroke="#CBB487" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M 1140 640 Q 1370 640 1560 650" fill="none" stroke="#CBB487" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M 1120 700 Q 1280 820 1430 860" fill="none" stroke="#CBB487" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

  <!-- 中心枢纽 -->
  <ellipse cx="1100" cy="680" rx="70" ry="16" fill="#C9AE7E" opacity="0.4"/>
  <g>
    <rect x="1028" y="596" width="150" height="150" rx="42" fill="#C98A3B"/>
    <rect x="1044" y="612" width="118" height="118" rx="34" fill="#D99B4E"/>
    <circle cx="1103" cy="652" r="24" fill="#F2E3BE"/>
    <circle cx="1103" cy="652" r="12" fill="#C98A3B"/>
    <circle cx="1103" cy="700" r="4" fill="#F2E3BE"/>
  </g>

  <!-- 渠道卡片 A：闲鱼（琥珀） -->
  <g>
    <ellipse cx="1510" cy="452" rx="110" ry="18" fill="#C9AE7E" opacity="0.4"/>
    <rect x="1400" y="330" width="220" height="250" rx="26" fill="url(#card1)"/>
    <rect x="1400" y="330" width="220" height="58" rx="26" fill="#C98A3B"/>
    <rect x="1400" y="360" width="220" height="28" fill="#C98A3B"/>
    <circle cx="1440" cy="392" r="9" fill="#F2E3BE"/>
    <circle cx="1584" cy="392" r="9" fill="#F2E3BE"/>
    <!-- 对话气泡 -->
    <rect x="1424" y="428" width="150" height="40" rx="20" fill="#F6ECCB"/>
    <rect x="1468" y="486" width="128" height="40" rx="20" fill="#E5D6B4"/>
    <rect x="1424" y="528" width="80" height="26" rx="13" fill="#C98A3B"/>
  </g>

  <!-- 渠道卡片 B：WhatsApp（绿） -->
  <g>
    <ellipse cx="1570" cy="682" rx="100" ry="16" fill="#C9AE7E" opacity="0.4"/>
    <rect x="1470" y="560" width="200" height="240" rx="24" fill="#E7DCB6"/>
    <rect x="1470" y="560" width="200" height="54" rx="24" fill="#7C9A6D"/>
    <rect x="1470" y="588" width="200" height="26" fill="#7C9A6D"/>
    <circle cx="1506" cy="606" r="9" fill="#E7DCB6"/>
    <circle cx="1634" cy="606" r="9" fill="#E7DCB6"/>
    <path d="M 1494 648 q 62 -18 126 6" fill="none" stroke="#7C9A6D" stroke-width="12" stroke-linecap="round"/>
    <rect x="1494" y="700" width="140" height="40" rx="20" fill="#F2E7C8"/>
    <rect x="1494" y="756" width="110" height="40" rx="20" fill="#E5D6B4"/>
  </g>

  <!-- 渠道卡片 C：更多（中性 +） -->
  <g>
    <ellipse cx="1430" cy="890" rx="90" ry="15" fill="#C9AE7E" opacity="0.4"/>
    <rect x="1340" y="790" width="180" height="200" rx="24" fill="#E2D2A8"/>
    <circle cx="1430" cy="862" r="30" fill="#D9C499"/>
    <path d="M 1418 862 h 24 M 1430 850 v 24" stroke="#B99F74" stroke-width="12" stroke-linecap="round"/>
    <rect x="1362" y="912" width="136" height="22" rx="11" fill="#CBB487"/>
  </g>

  <!-- 前景地面 -->
  <ellipse cx="980" cy="1050" rx="820" ry="110" fill="#E0CEA6" opacity="0.5"/>

  <!-- 尘埃光斑 -->
  <circle cx="300" cy="340" r="7" fill="#E8D6AC" opacity="0.6"/>
  <circle cx="700" cy="260" r="5" fill="#E8D6AC" opacity="0.5"/>
  <circle cx="520" cy="760" r="8" fill="#E8D6AC" opacity="0.45"/>
  <circle cx="1750" cy="820" r="6" fill="#E8D6AC" opacity="0.5"/>
  <circle cx="260" cy="620" r="6" fill="#E8D6AC" opacity="0.5"/>
</svg>
