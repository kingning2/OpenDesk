<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="粘土微缩场景：数据锁在本地设备">
  <defs>
    <radialGradient id="glow" cx="0.72" cy="0.2" r="0.7" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFF4DD" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#F6E5C0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F5EDE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7D9CB8"/>
      <stop offset="1" stop-color="#5F7E9C"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7D9CB8"/>
      <stop offset="1" stop-color="#55728F"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#F5EDE0"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- 背景墙与关上的百叶窗（隐私感） -->
  <rect x="0" y="0" width="1920" height="520" fill="#EBDCB6"/>
  <path d="M0 460 Q 480 400 980 470 T 1920 450 V 520 H 0 Z" fill="#E4D2AE"/>
  <rect x="1240" y="120" width="380" height="330" rx="18" fill="#DCC79B"/>
  <rect x="1264" y="146" width="332" height="280" rx="12" fill="#C9B184"/>
  <path d="M 1264 176 h 332 M 1264 210 h 332 M 1264 244 h 332 M 1264 278 h 332 M 1264 312 h 332 M 1264 346 h 332 M 1264 380 h 332" stroke="#B99F74" stroke-width="12" stroke-linecap="round"/>

  <!-- 地面 -->
  <path d="M0 640 Q 560 580 1100 660 T 1920 630 V 1080 H 0 Z" fill="#E7D8AE"/>

  <!-- 桌子 -->
  <path d="M 760 1080 Q 748 866 780 830 L 1580 742 Q 1614 737 1640 764 L 1730 856 Q 1756 884 1744 922 L 1714 1080 Z" fill="#D9C499"/>
  <path d="M 780 830 L 1580 742 Q 1614 737 1640 764 L 1718 850 L 800 932 Q 778 870 780 830 Z" fill="#E3D3AA"/>

  <!-- 笔记本 -->
  <g>
    <rect x="1240" y="560" width="420" height="250" rx="20" fill="#C2A87A"/>
    <rect x="1256" y="576" width="388" height="200" rx="12" fill="#5F7E9C"/>
    <path d="M 1240 792 L 1248 826 q 4 16 20 16 h 384 q 16 0 20 -16 l 8 -34 Z" fill="#B99F74"/>
    <!-- 屏幕上的锁 -->
    <rect x="1412" y="640" width="76" height="58" rx="12" fill="#C4D4E4"/>
    <circle cx="1450" cy="630" r="22" fill="none" stroke="#EAF1F6" stroke-width="14"/>
    <circle cx="1450" cy="692" r="24" fill="#EAF1F6"/>
  </g>

  <!-- 悬浮盾牌（本地安全） -->
  <g>
    <path d="M 1080 420 L 1180 392 L 1180 512 Q 1180 560 1130 584 L 1080 560 L 1030 584 Q 980 560 980 512 L 980 392 Z" fill="url(#shield)"/>
    <path d="M 1036 424 L 1124 404 L 1124 506 Q 1124 546 1080 566 L 1080 546 L 1036 562 Q 992 546 992 506 L 992 404 Z" fill="#6E8CA8"/>
    <rect x="1032" y="486" width="96" height="66" rx="14" fill="#EAF1F6"/>
    <circle cx="1080" cy="500" r="20" fill="none" stroke="#6E8CA8" stroke-width="12"/>
    <rect x="1062" y="530" width="36" height="24" rx="6" fill="#6E8CA8"/>
  </g>

  <!-- 本地数据库圆柱 -->
  <g>
    <ellipse cx="900" cy="780" rx="150" ry="20" fill="#C9AE7E" opacity="0.4"/>
    <path d="M 780 700 L 780 852 Q 780 884 900 884 Q 1020 884 1020 852 L 1020 700 Z" fill="url(#cyl)"/>
    <ellipse cx="900" cy="700" rx="120" ry="40" fill="#7D9CB8"/>
    <ellipse cx="900" cy="700" rx="120" ry="40" fill="none" stroke="#55728F" stroke-width="6" stroke-dasharray="10 8"/>
    <ellipse cx="900" cy="790" rx="120" ry="40" fill="none" stroke="#55728F" stroke-width="6" stroke-dasharray="10 8"/>
    <rect x="876" y="792" width="48" height="42" rx="9" fill="#EAF1F6"/>
    <circle cx="900" cy="804" r="10" fill="none" stroke="#6E8CA8" stroke-width="6"/>
  </g>

  <!-- 前景地面 -->
  <ellipse cx="1000" cy="1060" rx="840" ry="100" fill="#E0CEA6" opacity="0.55"/>

  <!-- 尘埃光斑 -->
  <circle cx="300" cy="340" r="7" fill="#E8D6AC" opacity="0.6"/>
  <circle cx="560" cy="620" r="6" fill="#E8D6AC" opacity="0.5"/>
  <circle cx="1700" cy="560" r="6" fill="#E8D6AC" opacity="0.5"/>
  <circle cx="240" cy="820" r="8" fill="#E8D6AC" opacity="0.45"/>
</svg>
